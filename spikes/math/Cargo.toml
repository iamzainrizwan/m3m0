[package]
name = "math-spike"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
a = ["dep:ratex-parser", "dep:ratex-layout", "dep:ratex-render", "dep:ratex-types"]
b = ["dep:mathjax_svg", "dep:resvg"]

[dependencies]
serde_json = "1"
png = "0.17"
ratex-parser = { version = "=0.1.16", optional = true }
ratex-layout = { version = "=0.1.16", optional = true }
ratex-types = { version = "=0.1.16", optional = true }
ratex-render = { version = "=0.1.16", optional = true, features = ["embed-fonts"] }
mathjax_svg = { package = "mathjax-svg-rs", version = "0.4", optional = true }
resvg = { version = "0.45", optional = true }

[[bin]]
name = "base"
path = "src/base.rs"
[[bin]]
name = "a"
path = "src/a.rs"
required-features = ["a"]
[[bin]]
name = "b"
path = "src/b.rs"
required-features = ["b"]

[profile.release]
opt-level = 3
