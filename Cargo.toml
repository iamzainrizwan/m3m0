[package]
name = "m3m0"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
hayro = "0.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ratex-layout = "=0.1.16"
ratex-parser = "=0.1.16"
ratex-render = { version = "=0.1.16", features = ["embed-fonts"] }
ratex-types = "=0.1.16"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tungstenite = "0.30.0"
